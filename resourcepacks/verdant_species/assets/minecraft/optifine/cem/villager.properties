## Verdant Species — EMF villager model overrides
## Model 1 = default (Human) — no override
## Model 2 = Dwarf (stocky, bearded, leather apron)
## Model 3 = Goblin (hunched, sharp, green-toned)
## Model 4 = Gnome (small, wrapped head, compass)
## Model 5 = Troll (large, chunky — texture varies by material via ETF)
## Model 6 = Igor (hunched, stitched face, surgical apron)

# ── Dwarf: smith professions ──────────────────────────────────
skins.1=2
professions.1=armorer toolsmith weaponsmith

# ── Goblin: swamp / mangrove / dark forest ────────────────────
skins.2=3
biomes.2=swamp mangrove_swamp dark_forest

# ── Gnome: desert / badlands / hot savanna ────────────────────
skins.3=4
biomes.3=desert badlands savanna

# ── Troll: has VerdantTrollMaterial NBT ───────────────────────
skins.4=5
nbt.4.VerdantTrollMaterial=*

# ── Igor: butcher profession + name "Igor" ────────────────────
skins.5=6
professions.5=butcher
name.5=Igor
